name: Sync JustMc assets

# Daily sync of skill/docs/{actions,events,values} with
# realDosed/justmc-assets (documentation/ru_RU).
# skill/VERSION.md and skill/SKILL.md are never modified.

on:
  schedule:
    - cron: '0 3 * * *'   # every day at 03:00 UTC (06:00 MSK)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-assets
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync docs from upstream
        run: python3 scripts/sync_assets.py

      - name: Commit and push changes
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add skill/docs
          if git diff --cached --quiet; then
            echo "assets unchanged, nothing to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          UPSTREAM_SHA=$(gh api repos/realDosed/justmc-assets/commits/master --jq .sha | cut -c1-7)
          git commit -m "chore: sync assets from justmc-assets@${UPSTREAM_SHA} (ru_RU)"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN don't trigger other workflows,
      # so start the JAI.md rebuild explicitly.
      - name: Rebuild JAI.md
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-zip.yml --ref main
