name: Build JAI.zip + JAI.md

on:
  push:
    branches: [main]
    paths: ['skill/**', '.github/workflows/build-zip.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build JAI.zip
        run: |
          rm -rf staging
          mkdir -p staging/JAI
          cp -r skill/SKILL.md skill/VERSION.md skill/docs staging/JAI/
          cd staging
          zip -r ../JAI.zip JAI
          cd ..
          rm -rf staging

      - name: Build JAI.md (flat readable build)
        run: |
          rm -f JAI.md
          {
            echo "# JAI - flat readable build"
            echo ""
            echo "Single-file build of the JAI skill (auto-generated - do not edit). For models and tools that cannot read the JAI.zip archive. Each part below is one file of the skill, marked with an HTML comment: FILE: path."
            echo ""
            for f in skill/SKILL.md skill/VERSION.md skill/docs/rules.md skill/docs/lookup.md skill/docs/syntax.md skill/docs/actions/*.md skill/docs/events/events.md skill/docs/values/values.md skill/docs/value-types/*.md skill/docs/examples/cheatsheet.md; do
              echo ""
              echo "<!-- ===== FILE: $f ===== -->"
              cat "$f"
              echo ""
            done
          } > JAI.md

      - name: Commit rebuilt artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "artifacts unchanged, nothing to commit"
            exit 0
          fi
          git commit -m "chore: rebuild JAI.zip + JAI.md [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main