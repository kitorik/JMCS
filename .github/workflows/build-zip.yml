name: Build JAI.zip

on:
  push:
    branches: [main]
    paths: ['skill/**', '.github/workflows/build-zip.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build JAI.zip
        run: |
          rm -rf staging
          mkdir -p staging/JAI
          cp -r skill/SKILL.md skill/VERSION.md skill/docs staging/JAI/
          cd staging
          zip -r ../JAI.zip JAI
          cd ..
          rm -rf staging

      - name: Commit rebuilt zip
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "zip unchanged, nothing to commit"
            exit 0
          fi
          git commit -m "chore: rebuild JAI.zip [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main